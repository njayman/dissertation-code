apiVersion: apps/v1
kind: Deployment
metadata:
  name: devmind-cloud
  namespace: devmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devmind-cloud
  template:
    metadata:
      labels:
        app: devmind-cloud
    spec:
      containers:
        - name: devmind-cloud
          image: devmind-cloud:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devmind-cloud
  namespace: devmind
spec:
  selector:
    app: devmind-cloud
  ports:
    - port: 8001
      targetPort: 8001
