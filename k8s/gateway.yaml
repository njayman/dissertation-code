apiVersion: apps/v1
kind: Deployment
metadata:
  name: devmind-gateway
  namespace: devmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devmind-gateway
  template:
    metadata:
      labels:
        app: devmind-gateway
    spec:
      containers:
        - name: devmind-gateway
          image: devmind-gateway:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DEVMIND_CLOUD_URL
              value: http://devmind-cloud:8001
          envFrom:
            - configMapRef:
                name: devmind-test-knobs
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devmind-gateway
  namespace: devmind
spec:
  type: NodePort
  selector:
    app: devmind-gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
